spring.application.name=arumdaun-cemetery
server.port=${SERVER_PORT:8080}

spring.datasource.url=${CEMETERY_DB_URL:jdbc:postgresql://localhost:5432/cemetery}
spring.datasource.username=${CEMETERY_DB_USER:wonhooh}
spring.datasource.password=${CEMETERY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway migrations
