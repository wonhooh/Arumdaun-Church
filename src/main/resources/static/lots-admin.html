<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lot Information | Arumdaun Church Cemetery</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17202a; background: #f3f6f8; }
        body { margin: 0; }
        main { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
        nav { display: flex; gap: 18px; margin-bottom: 28px; }
        a { color: #176b45; }
        h1, h2 { margin: 0 0 16px; }
        .layout { display: grid; grid-template-columns: minmax(260px, .8fr) 1.2fr; gap: 32px; align-items: start; }
        form { display: grid; gap: 16px; padding: 24px; background: white; border-top: 4px solid #176b45; }
        label { display: grid; gap: 6px; font-weight: 700; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #b9c5cc; border-radius: 4px; font: inherit; }
        textarea { min-height: 112px; resize: vertical; }
        button { width: fit-content; padding: 10px 16px; border: 0; border-radius: 4px; background: #176b45; color: white; font: inherit; cursor: pointer; }
        button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #d8b56a; outline-offset: 2px; }
        #message { min-height: 1.5em; margin: 0; font-weight: 700; }
        .table-scroll { max-height: 520px; overflow: auto; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #d9e1e6; text-align: left; vertical-align: top; }
        th { position: sticky; top: 0; background: #e8eef2; }
        @media (max-width: 700px) { main { padding: 24px 16px; } .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <nav><a href="/">Cemetery home</a><a href="/admin.html">Clients</a></nav>
    <h1>Lot information</h1>
    <div class="layout">
        <section aria-labelledby="entry-heading">
            <h2 id="entry-heading">Enter a lot</h2>
            <form id="lot-form">
                <label>Lot number <input name="lotNumber" required maxlength="100" autocomplete="off"></label>
                <label>Price (USD) <input name="price" type="number" min="0" step="0.01" required></label>
                <label>Information <textarea name="information" maxlength="2000" placeholder="Optional details"></textarea></label>
                <button type="submit">Save lot</button>
                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section aria-labelledby="existing-heading">
            <h2 id="existing-heading">Existing lots</h2>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>Lot</th><th>Price</th><th>Status</th><th>Information</th></tr></thead>
                    <tbody id="lots"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<script>
    const form = document.querySelector('#lot-form');
    const message = document.querySelector('#message');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    const money = value => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
    const loadLots = () => fetch('/api/lots')
        .then(response => response.ok ? response.json() : Promise.reject(new Error('Unable to load lots.')))
        .then(lots => {
            document.querySelector('#lots').innerHTML = lots.map(lot =>
                `<tr><td>${escapeHtml(lot.lotNumber)}</td><td>${money(lot.price)}</td><td>${lot.sold ? 'Reserved' : 'Available'}</td><td>${escapeHtml(lot.information)}</td></tr>`
            ).join('');
        });
    loadLots().catch(error => { message.textContent = error.message; });
    form.addEventListener('submit', event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        data.price = Number(data.price);
        fetch('/api/admin/lots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(async response => {
            if (response.ok) return response.json();
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || error.message || 'Unable to save lot.');
        }).then(() => {
            form.reset();
            message.textContent = 'Lot saved.';
            return loadLots();
        }).catch(error => { message.textContent = error.message; });
    });
</script>
</body>
</html>
