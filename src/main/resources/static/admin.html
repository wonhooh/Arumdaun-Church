<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Arumdaun Church Cemetery</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17202a; background: #f3f6f8; }
        body { margin: 0; } main { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .table-scroll { max-height: 320px; overflow: auto; background: white; margin: 16px 0 32px; }
        table { width: max-content; min-width: 100%; border-collapse: collapse; }
        th, td { max-width: 24rem; padding: 12px 14px; border-bottom: 1px solid #d9e1e6; text-align: left; overflow-wrap: anywhere; }
        th { position: sticky; top: 0; background: #e8eef2; z-index: 1; }
        .table-actions, .table-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .table-actions button[aria-pressed="true"] { background: #124d34; }
        .table-toolbar { justify-content: space-between; }
        .table-toolbar > div { display: flex; flex-wrap: wrap; gap: 12px; }
        .table-toolbar h3 { margin: 0; }
        .table-scroll.full-table {
            display: block;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            max-height: 520px;
            overflow-x: scroll;
            overflow-y: auto;
            scrollbar-width: auto;
            scrollbar-color: #687780 #d9e1e6;
        }
        .table-scroll.full-table table { width: max-content; min-width: max-content; }
        .table-scroll.full-table th, .table-scroll.full-table td {
            max-width: none;
            white-space: nowrap;
            overflow-wrap: normal;
        }
        .horizontal-scroll-control { margin: 8px 0; }
        .horizontal-scroll-control label { display: block; margin-bottom: 4px; font-size: .9rem; }
        .horizontal-scroll-control input {
            display: block;
            width: 100%;
            height: 28px;
            padding: 0;
            accent-color: #176b45;
            cursor: ew-resize;
        }
        .table-scroll.full-table::-webkit-scrollbar { height: 14px; }
        .table-scroll.full-table::-webkit-scrollbar-track { background: #d9e1e6; }
        .table-scroll.full-table::-webkit-scrollbar-thumb {
            border: 3px solid #d9e1e6;
            border-radius: 8px;
            background: #687780;
        }
        .lot-editor { max-width: 640px; margin: 12px 0 24px; padding: 20px; background: white; }
        .lot-editor form { margin-top: 16px; }
        .lot-editor-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .lot-editor .checkbox-field { display: flex; align-items: center; gap: 10px; }
        .lot-editor .checkbox-field input { width: auto; }
        .transaction-editor { max-width: 760px; margin: 12px 0 24px; padding: 20px; background: white; }
        .transaction-editor form { margin-top: 16px; }
        .transaction-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid #d9e1e6; }
        .transaction-list { display: grid; gap: 8px; overflow-x: auto; }
        .transaction-entry { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(100px, .7fr) minmax(140px, 1fr) minmax(130px, .9fr) minmax(120px, .8fr) minmax(160px, 1.2fr) auto; gap: 8px; align-items: end; min-width: 1050px; padding: 12px; border: 1px solid #d9e1e6; border-radius: 6px; }
        .transaction-entry label { min-width: 0; }
        .transaction-entry input, .transaction-entry select { box-sizing: border-box; width: 100%; min-width: 0; }
        .transaction-entry .transaction-amount-label { white-space: nowrap; }
        .transaction-entry [data-remove-transaction] { white-space: nowrap; }
        form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; background: white; padding: 24px; }
        label { display: grid; gap: 6px; font-weight: 700; } input { padding: 10px; border: 1px solid #b9c5cc; border-radius: 4px; font: inherit; }
        select { padding: 10px; border: 1px solid #b9c5cc; border-radius: 4px; font: inherit; }
        .wide { grid-column: 1 / -1; } .actions { display: flex; gap: 12px; align-items: center; }
        button, a { padding: 10px 16px; border: 0; border-radius: 6px; background: #176b45; color: white; text-decoration: none; font: inherit; cursor: pointer; }
        @media (max-width: 650px) { form { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
    </style>
</head>
<body><main>
    <p><a href="/">Home</a></p>
    <section aria-labelledby="table-data-heading">
        <h2 id="table-data-heading">Database tables</h2>
        <p>Select a table to view all its records, download a CSV, or upload a CSV to insert or update records. Upserts use client ID, lot number, or transaction ID as the matching key.</p>
        <div class="table-actions" aria-label="Choose a database table">
            <button type="button" data-table="clients" aria-pressed="false">Clients</button>
            <button type="button" data-table="lots" aria-pressed="false">Lots</button>
            <button type="button" data-table="transactions" aria-pressed="false">Transactions</button>
        </div>
        <p id="table-message" role="status" aria-live="polite"></p>
        <div class="table-toolbar" id="table-toolbar" hidden>
            <h3 id="selected-table-title"></h3>
            <div>
                <button id="download-table" type="button" disabled>Download CSV</button>
                <button id="upload-table" type="button" disabled>Upload CSV</button>
                <input id="upload-table-file" type="file" accept=".csv,text/csv" hidden>
            </div>
        </div>
        <div class="horizontal-scroll-control" id="horizontal-scroll-control" hidden>
            <label for="table-horizontal-scroll">Scroll table horizontally</label>
            <input id="table-horizontal-scroll" type="range" min="0" max="0" value="0"
                   aria-controls="admin-table-container" aria-label="Scroll table horizontally">
        </div>
        <div class="table-scroll full-table" id="admin-table-container" hidden>
            <table>
                <thead id="admin-table-head"></thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
        <section id="lot-editor" class="lot-editor" aria-labelledby="lot-editor-heading" hidden>
            <h3 id="lot-editor-heading">View / Edit lot</h3>
            <p id="lot-editor-message" role="status" aria-live="polite"></p>
            <div class="lot-editor-details">
                <p><strong>Lot number:</strong> <span id="lot-editor-number"></span></p>
                <p><strong>Client ID:</strong> <span id="lot-editor-client"></span></p>
            </div>
            <form id="lot-editor-form">
                <label>Price <input name="price" type="number" min="0" step="0.01" required></label>
                <label class="wide">Information <input name="information"></label>
                <label class="checkbox-field wide">
                    <input name="paidInFull" type="checkbox">
                    Paid in full
                </label>
                <div class="wide actions">
                    <button type="submit">Save lot</button>
                    <button id="cancel-lot-edit" type="button">Close</button>
                </div>
            </form>
        </section>
        <section id="admin-transaction-editor" class="transaction-editor" aria-labelledby="admin-transaction-editor-heading" hidden>
            <h3 id="admin-transaction-editor-heading">View / Edit transaction</h3>
            <p id="admin-transaction-editor-message" role="status" aria-live="polite"></p>
            <p><strong>Transaction ID:</strong> <span id="admin-transaction-id"></span>
                <strong>Client ID:</strong> <span id="admin-transaction-client"></span></p>
            <form id="admin-transaction-editor-form">
                <label>Type
                    <select name="transactionType" required>
                        <option value="PURCHASE">Purchase</option>
                        <option value="PAYMENT">Payment</option>
                        <option value="REFUND">Refund</option>
                        <option value="CANCEL">Cancel</option>
                    </select>
                </label>
                <label>Lot number <input name="lotNumber" type="number" min="1" max="500" step="1" required></label>
                <label>Amount <input name="amount" type="number" min="0" step="0.01" required></label>
                <label>Method <input name="method"></label>
                <label>Date <input name="transactionDate" type="date" required></label>
                <label class="wide">Memo <input name="memo" maxlength="2000"></label>
                <div class="wide actions">
                    <button type="submit">Save transaction</button>
                    <button id="cancel-admin-transaction-edit" type="button">Close</button>
                </div>
            </form>
        </section>
    </section>
</main><script src="/display-format.js"></script>
<script>
    const tableButtons = document.querySelectorAll('[data-table]');
    const tableMessage = document.querySelector('#table-message');
    const downloadTableButton = document.querySelector('#download-table');
    const uploadTableButton = document.querySelector('#upload-table');
    const uploadTableFile = document.querySelector('#upload-table-file');
    const tableToolbar = document.querySelector('#table-toolbar');
    const tableContainer = document.querySelector('#admin-table-container');
    const horizontalScrollControl = document.querySelector('#horizontal-scroll-control');
    const horizontalScroll = document.querySelector('#table-horizontal-scroll');
    const lotEditor = document.querySelector('#lot-editor');
    const lotEditorForm = document.querySelector('#lot-editor-form');
    const adminTransactionEditor = document.querySelector('#admin-transaction-editor');
    const adminTransactionForm = document.querySelector('#admin-transaction-editor-form');
    let editingLotNumber = null;
    let editingAdminTransactionId = null;
    let selectedTable = null;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'\"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '\"': '&quot;' }[character]));
    const moneyColumns = new Set(['price', 'total_price', 'amount_paid', 'amount', 'refund_amount']);
    const dateColumns = new Set(['date', 'transaction_date', 'cancellation_date', 'deleted_date']);
    const formatTableValue = (value, column) => {
        if (value === null || value === undefined) return '';
        if (moneyColumns.has(column)) return DisplayFormats.formatMoney(value);
        if (dateColumns.has(column) || column.endsWith('_date')) return DisplayFormats.formatDate(value);
        if (column === 'phone1' || column === 'phone2') return DisplayFormats.formatPhone(value);
        return Array.isArray(value) ? value.join(', ') : value;
    };
    const updateHorizontalScroll = () => {
        const maxScroll = Math.max(0, tableContainer.scrollWidth - tableContainer.clientWidth);
        horizontalScroll.max = String(maxScroll);
        horizontalScroll.value = String(Math.min(tableContainer.scrollLeft, maxScroll));
        horizontalScrollControl.hidden = maxScroll === 0;
    };
    horizontalScroll.addEventListener('input', () => {
        tableContainer.scrollLeft = Number(horizontalScroll.value);
    });
    tableContainer.addEventListener('scroll', () => {
        horizontalScroll.value = String(tableContainer.scrollLeft);
    });
    window.addEventListener('resize', updateHorizontalScroll);
    const showTable = async button => {
        const tableName = button.dataset.table;
        tableMessage.textContent = `Loading ${tableName}...`;
        downloadTableButton.disabled = true;
        uploadTableButton.disabled = true;
        try {
            const response = await fetch(`/api/admin/tables/${encodeURIComponent(tableName)}`);
            if (!response.ok) throw new Error(`Unable to load ${tableName}.`);
            const data = await response.json();
            selectedTable = data;
            const hasClientActions = data.name === 'clients';
            const hasLotActions = data.name === 'lots';
            const hasTransactionActions = data.name === 'transactions';
            const hasRowActions = hasClientActions || hasLotActions || hasTransactionActions;
            lotEditor.hidden = true;
            adminTransactionEditor.hidden = true;
            document.querySelector('#selected-table-title').textContent =
                `${data.name.charAt(0).toUpperCase()}${data.name.slice(1)}`;
            document.querySelector('#admin-table-head').innerHTML =
                `<tr>${hasRowActions ? '<th scope="col">Actions</th>' : ''}${data.columns.map(column => `<th scope="col">${escapeHtml(column)}</th>`).join('')}</tr>`;
            document.querySelector('#admin-table-body').innerHTML = data.rows.length
                ? data.rows.map(row => {
                    const cells = row.map((value, index) =>
                        `<td>${escapeHtml(formatTableValue(value, data.columns[index]))}</td>`
                    ).join('');
                    const rowId = row[data.columns.indexOf(hasLotActions ? 'lot_number' : 'id')];
                    let actions = '';
                    if (hasClientActions) {
                        actions = `<a href="/clients-admin.html?clientId=${encodeURIComponent(rowId)}">View / Edit</a>
                            <button type="button" data-delete-client="${escapeHtml(rowId)}">Delete</button>`;
                    } else if (hasLotActions) {
                        actions = `<button type="button" data-edit-lot="${escapeHtml(rowId)}">View / Edit</button>`;
                    } else if (hasTransactionActions) {
                        actions = `<button type="button" data-edit-admin-transaction="${escapeHtml(rowId)}">View / Edit</button>`;
                    }
                    return `<tr>${hasRowActions ? `<td>${actions}</td>` : ''}${cells}</tr>`;
                }).join('')
                : `<tr><td colspan="${data.columns.length + (hasRowActions ? 1 : 0)}">No records found.</td></tr>`;
            tableContainer.hidden = false;
            const table = tableContainer.querySelector('table');
            table.style.minWidth =
                `${Math.max((data.columns.length + (hasRowActions ? 1 : 0)) * 150, tableContainer.clientWidth)}px`;
            tableContainer.scrollLeft = 0;
            tableToolbar.hidden = false;
            downloadTableButton.disabled = false;
            uploadTableButton.disabled = false;
            tableButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
            tableMessage.textContent = `${data.rows.length} record${data.rows.length === 1 ? '' : 's'} loaded.`;
            requestAnimationFrame(updateHorizontalScroll);
        } catch (error) {
            selectedTable = null;
            tableContainer.hidden = true;
            tableToolbar.hidden = true;
            horizontalScrollControl.hidden = true;
            lotEditor.hidden = true;
            tableButtons.forEach(item => item.setAttribute('aria-pressed', 'false'));
            document.querySelector('#selected-table-title').textContent = '';
            tableMessage.textContent = error.message || `Unable to load ${tableName}.`;
        }
    };
    tableButtons.forEach(button => button.addEventListener('click', () => showTable(button)));
    tableContainer.addEventListener('click', event => {
        const deleteClientButton = event.target.closest('[data-delete-client]');
        if (deleteClientButton && selectedTable?.name === 'clients') {
            if (!confirm('Delete this client? The record will be hidden but retained in the database.')) return;
            deleteClientButton.disabled = true;
            fetch(`/api/admin/clients/${encodeURIComponent(deleteClientButton.dataset.deleteClient)}`, {
                method: 'DELETE'
            }).then(async response => {
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.detail || result.message || 'Unable to delete client.');
                await showTable(document.querySelector('[data-table="clients"]'));
            }).catch(error => {
                deleteClientButton.disabled = false;
                tableMessage.textContent = error.message || 'Unable to delete client.';
            });
            return;
        }
        const editLotButton = event.target.closest('[data-edit-lot]');
        if (editLotButton && selectedTable?.name === 'lots') {
            showLotEditor(editLotButton.dataset.editLot);
            return;
        }
        const button = event.target.closest('[data-edit-admin-transaction]');
        if (!button || !selectedTable || selectedTable.name !== 'transactions') return;
        const transactionId = button.dataset.editAdminTransaction;
        const row = selectedTable.rows.find(item =>
            String(item[selectedTable.columns.indexOf('id')]) === transactionId);
        if (!row) return;
        const value = column => row[selectedTable.columns.indexOf(column)];
        editingAdminTransactionId = transactionId;
        document.querySelector('#admin-transaction-id').textContent = transactionId;
        document.querySelector('#admin-transaction-client').textContent = value('client_id') ?? '';
        adminTransactionForm.elements.transactionType.value = value('transaction_type') ?? '';
        adminTransactionForm.elements.lotNumber.value = value('lot_number') ?? '';
        adminTransactionForm.elements.amount.value = value('amount') ?? 0;
        adminTransactionForm.elements.method.value = value('method') ?? '';
        adminTransactionForm.elements.transactionDate.value = value('transaction_date') ?? '';
        adminTransactionForm.elements.memo.value = value('memo') ?? '';
        document.querySelector('#admin-transaction-editor-message').textContent = '';
        adminTransactionEditor.hidden = false;
        adminTransactionEditor.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    document.querySelector('#cancel-admin-transaction-edit').addEventListener('click', () => {
        adminTransactionEditor.hidden = true;
        editingAdminTransactionId = null;
    });
    adminTransactionForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (editingAdminTransactionId === null) return;
        const saveButton = adminTransactionForm.querySelector('[type="submit"]');
        saveButton.disabled = true;
        document.querySelector('#admin-transaction-editor-message').textContent = 'Saving transaction...';
        try {
            const type = adminTransactionForm.elements.transactionType.value;
            const response = await fetch(
                `/api/admin/transactions/${encodeURIComponent(editingAdminTransactionId)}`,
                {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        transactionType: type,
                        lotNumber: Number(adminTransactionForm.elements.lotNumber.value),
                        amount: type === 'CANCEL' ? 0 : Number(adminTransactionForm.elements.amount.value),
                        method: adminTransactionForm.elements.method.value,
                        transactionDate: adminTransactionForm.elements.transactionDate.value,
                        memo: adminTransactionForm.elements.memo.value
                    })
                });
            const responseText = await response.text();
            let result = {};
            if (responseText) {
                try {
                    result = JSON.parse(responseText);
                } catch {
                    result.detail = responseText.trim().slice(0, 400);
                }
            }
            if (!response.ok) {
                throw new Error(result.detail || result.message || result.error
                    || `HTTP ${response.status} ${response.statusText}`.trim());
            }
            const button = [...tableButtons].find(item => item.dataset.table === 'transactions');
            if (button) await showTable(button);
            const updatedButton = [...tableContainer.querySelectorAll('[data-edit-admin-transaction]')]
                .find(item => item.dataset.editAdminTransaction === editingAdminTransactionId);
            if (updatedButton) {
                updatedButton.click();
                document.querySelector('#admin-transaction-editor-message').textContent = 'Transaction saved.';
            }
        } catch (error) {
            document.querySelector('#admin-transaction-editor-message').textContent =
                error.message || 'Unable to save transaction.';
        } finally {
            saveButton.disabled = false;
        }
    });
    const showLotEditor = lotNumber => {
        if (!selectedTable || selectedTable.name !== 'lots') return;
        const row = selectedTable.rows.find(item =>
            String(item[selectedTable.columns.indexOf('lot_number')]) === String(lotNumber));
        if (!row) return;
        const value = column => row[selectedTable.columns.indexOf(column)];
        editingLotNumber = String(value('lot_number'));
        document.querySelector('#lot-editor-number').textContent = editingLotNumber;
        document.querySelector('#lot-editor-client').textContent = value('client_id') || 'Unassigned';
        lotEditorForm.elements.price.value = value('price');
        lotEditorForm.elements.information.value = value('information') ?? '';
        lotEditorForm.elements.paidInFull.checked = value('paid_in_full') === true;
        document.querySelector('#lot-editor-message').textContent = '';
        lotEditor.hidden = false;
        lotEditor.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    document.querySelector('#cancel-lot-edit').addEventListener('click', () => {
        lotEditor.hidden = true;
        editingLotNumber = null;
    });
    lotEditorForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (editingLotNumber === null) return;
        const saveButton = lotEditorForm.querySelector('[type="submit"]');
        saveButton.disabled = true;
        document.querySelector('#lot-editor-message').textContent = 'Saving lot...';
        try {
            const response = await fetch(`/api/admin/lots/${encodeURIComponent(editingLotNumber)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    price: Number(lotEditorForm.elements.price.value),
                    information: lotEditorForm.elements.information.value,
                    paidInFull: lotEditorForm.elements.paidInFull.checked
                })
            });
            const responseText = await response.text();
            let result = {};
            if (responseText) {
                try {
                    result = JSON.parse(responseText);
                } catch {
                    result.detail = responseText.trim().slice(0, 400);
                }
            }
            if (!response.ok) {
                const reason = result.detail || result.message || result.error
                    || `HTTP ${response.status} ${response.statusText}`.trim();
                const guidance = response.status === 404 && !result.detail && !result.message
                    ? ' The running application may need to be rebuilt and restarted with the latest code.'
                    : '';
                throw new Error(`Unable to save lot: ${reason}.${guidance}`);
            }
            const button = [...tableButtons].find(item => item.dataset.table === 'lots');
            if (button) await showTable(button);
            const updatedLotButton = [...tableContainer.querySelectorAll('[data-edit-lot]')]
                .find(item => item.dataset.editLot === editingLotNumber);
            if (updatedLotButton) {
                showLotEditor(updatedLotButton.dataset.editLot);
                document.querySelector('#lot-editor-message').textContent = 'Lot saved.';
            }
        } catch (error) {
            document.querySelector('#lot-editor-message').textContent = error.message || 'Unable to save lot.';
        } finally {
            saveButton.disabled = false;
        }
    });
    uploadTableButton.addEventListener('click', () => {
        if (selectedTable) uploadTableFile.click();
    });
    uploadTableFile.addEventListener('change', async () => {
        const file = uploadTableFile.files[0];
        const tableName = selectedTable?.name;
        if (!file || !tableName) return;
        uploadTableButton.disabled = true;
        tableMessage.textContent = `Uploading ${file.name}...`;
        try {
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch(`/api/admin/tables/${encodeURIComponent(tableName)}`, {
                method: 'POST',
                body: formData
            });
            const responseText = await response.text();
            let result = {};
            if (responseText) {
                try {
                    result = JSON.parse(responseText);
                } catch {
                    result.detail = responseText.trim().slice(0, 400);
                }
            }
            if (!response.ok) {
                const reason = result.detail || result.message || result.error || result.title
                    || `HTTP ${response.status} ${response.statusText}`.trim();
                throw new Error(`CSV upload failed: ${reason}`);
            }
            tableMessage.textContent = `${result.rowsProcessed} row${result.rowsProcessed === 1 ? '' : 's'} uploaded.`;
            const button = [...tableButtons].find(item => item.dataset.table === tableName);
            if (button) await showTable(button);
        } catch (error) {
            tableMessage.textContent = error.message || 'Unable to upload CSV.';
            uploadTableButton.disabled = false;
        } finally {
            uploadTableFile.value = '';
        }
    });
    downloadTableButton.addEventListener('click', () => {
        if (!selectedTable) return;
        const requestedName = window.prompt(
            'Enter a file name for the CSV download:',
            `${selectedTable.name}.csv`
        );
        if (requestedName === null) return;
        let fileName = requestedName.trim();
        if (!fileName) return;
        fileName = `${fileName.replace(/\.csv$/i, '')}.csv`;

        const csvValue = value => {
            let text = value === null || value === undefined
                ? ''
                : Array.isArray(value) ? JSON.stringify(value) : String(value);
            if (typeof value === 'string' && /^[\t\r ]*[=+\-@]/.test(text)) text = `'${text}`;
            return `"${text.replace(/"/g, '""')}"`;
        };
        const lines = [
            selectedTable.columns.map(csvValue).join(','),
            ...selectedTable.rows.map(row => row.map(csvValue).join(','))
        ];
        const blob = new Blob(['\uFEFF', lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    });
</script></body></html>
